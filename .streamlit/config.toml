[theme]
base = "light"
# Colours taken from a Romanowsky-stained smear: azure-violet nuclei on a
# cool, glass-slide white. System fonts only, so nothing is downloaded.
primaryColor = "#4a3f9f"
backgroundColor = "#f6f7fb"
secondaryBackgroundColor = "#eceef6"
textColor = "#1c1d2b"
borderColor = "#dcdfea"
font = "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
baseRadius = "0.6rem"

[client]
toolbarMode = "minimal"

[server]
maxUploadSize = 20

[browser]
gatherUsageStats = false
